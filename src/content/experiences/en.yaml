  - company:
      name: iForte Payment Infrastructure
      url: ""
      location: ""
    positions:
      - designation: DevOps Engineer Lead
        start: Apr 2026
        end:
        responsibilities:
          - Lead cross-team architecture review for infrastructure changes, evaluating PCI-DSS payload exposure and sequencing against the platform roadmap.
          - Serve as DevOps/security technical point of contact for PCI-DSS and ISO 27001 audits — reviewing evidence and assigning remediation actions ahead of auditor presentation.
          - Own post-incident RCA process as escalation point for major incidents; drive platform reliability (SRE) roadmap across DC/DR/Tools GKE clusters, reporting to leadership.
          - Drive FinOps adoption for GKE workloads via Crawl-Walk-Run cost visibility framework, including team-led tooling POCs surfaced to management.
          - Standardize SOPs/governance guardrails balancing delivery velocity against production-access risk in a PCI-DSS-regulated environment.
          - Mentor and technically direct DevOps engineers, including onboarding of new hires and participation in technical interviews.
      - designation: Senior DevOps Engineer
        start: Okt 2022
        end: Apr 2026
        responsibilities:
          - Designed and operated multi-cluster Kubernetes (GKE) platform (DC/DR/Tools) with secure private networking.
          - Built secure CI/CD and GitOps ecosystem (Jenkins, ArgoCD, Kustomize) for controlled and auditable deployments.
          - Implemented shift-left security in CI/CD — SAST (Horusec), SCA/image scanning (Trivy), consolidated via SonarQube; enforced TLS and SIEM (Wazuh) monitoring.
          - Architected cloud networking, VPC segmentation, ILB routing, and Fortinet integration for secure traffic flows.
          - Established comprehensive observability using Prometheus, Grafana, Wazuh, ELK, and Kafka logging.
          - Collaborated closely with Backend and Compliance teams; informally mentored junior & middle DevOps engineers.
          - "Key achievement: migrated critical payment microservices from VM/Docker to Kubernetes (GKE) with a zero-downtime, rollback-safe strategy."
          - "Key achievement: designed and deployed the multi-cluster GKE platform with private networking, Fortinet integration, PCI-aligned segmentation, and secure ILB routing."
          - "Key achievement: built Jenkins infrastructure with PostgreSQL backend, GCS Fuse, and SSD storage; standardized CI/CD pipelines to improve delivery and audit readiness."
          - "Key achievement: implemented full GitOps lifecycle (Bitbucket → Jenkins → ArgoCD + Kustomize), ensuring governance, traceability, and deployment consistency."
          - "Key achievement: strengthened security posture via SIEM correlation, TLS hardening, and continuous vulnerability scanning."
          - "Key achievement: built end-to-end observability stack, significantly improving incident visibility and recovery time."
          - "Key achievement: standardized Kubernetes onboarding templates, reducing provisioning time from hours to minutes."

