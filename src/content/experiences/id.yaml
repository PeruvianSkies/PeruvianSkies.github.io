experiences:
  - company:
      name: iForte Payment Infrastructure
      url: ""
      location: ""
    positions:
      - designation: DevOps Engineer Lead
        start: Apr 2026
        end:
        responsibilities:
          - Memimpin architecture review lintas tim untuk perubahan infrastruktur, mengevaluasi eksposur payload PCI-DSS dan menyusun urutannya sesuai roadmap platform.
          - Menjadi technical point of contact DevOps/security untuk audit PCI-DSS dan ISO 27001 — mereview evidence dan menentukan remediation action sebelum presentasi ke auditor.
          - Memegang proses post-incident RCA sebagai eskalasi untuk insiden major; mendorong roadmap reliability (SRE) platform di seluruh cluster GKE DC/DR/Tools, melapor langsung ke leadership.
          - Mendorong adopsi FinOps untuk workload GKE lewat framework cost visibility Crawl-Walk-Run, termasuk POC tooling yang dipimpin tim dan dipresentasikan ke management.
          - Menstandarkan SOP/governance guardrail yang menyeimbangkan kecepatan delivery dengan risiko akses produksi di lingkungan yang diregulasi PCI-DSS.
          - Mentoring dan mengarahkan engineer DevOps secara teknis, termasuk onboarding new hire dan ikut serta dalam technical interview.
      - designation: Senior DevOps Engineer
        start: Okt 2022
        end: Apr 2026
        responsibilities:
          - Merancang dan mengoperasikan platform Kubernetes (GKE) multi-cluster (DC/DR/Tools) dengan private networking yang aman.
          - Membangun ekosistem CI/CD dan GitOps yang aman (Jenkins, ArgoCD, Kustomize) untuk deployment yang terkontrol dan auditable.
          - Menerapkan shift-left security di CI/CD — SAST (Horusec), SCA/image scanning (Trivy), dikonsolidasikan lewat SonarQube; menegakkan TLS dan monitoring SIEM (Wazuh).
          - Merancang cloud networking, segmentasi VPC, routing ILB, dan integrasi Fortinet untuk jalur traffic yang aman.
          - Membangun observability yang komprehensif menggunakan Prometheus, Grafana, Wazuh, ELK, dan Kafka logging.
          - Berkolaborasi erat dengan tim Backend dan Compliance; secara informal membimbing DevOps engineer junior & middle.
          - "Key achievement: migrasi microservices payment kritikal dari VM/Docker ke Kubernetes (GKE) dengan strategi zero-downtime dan rollback-safe."
          - "Key achievement: merancang dan menerapkan platform GKE multi-cluster dengan private networking, integrasi Fortinet, segmentasi selaras PCI, dan routing ILB yang aman."
          - "Key achievement: membangun infrastruktur Jenkins dengan backend PostgreSQL, GCS Fuse, dan SSD storage; menstandarkan pipeline CI/CD untuk meningkatkan kecepatan delivery dan kesiapan audit."
          - "Key achievement: menerapkan siklus GitOps penuh (Bitbucket → Jenkins → ArgoCD + Kustomize), menjaga governance, traceability, dan konsistensi deployment."
          - "Key achievement: memperkuat postur keamanan lewat korelasi SIEM, TLS hardening, dan vulnerability scanning berkelanjutan."
          - "Key achievement: membangun observability stack end-to-end, meningkatkan visibilitas insiden dan waktu recovery secara signifikan."
          - "Key achievement: menstandarkan template onboarding Kubernetes, memangkas waktu provisioning dari hitungan jam jadi menit."

