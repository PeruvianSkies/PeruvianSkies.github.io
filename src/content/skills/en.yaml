section:
  name: Skills
  id: skills
  enable: true
  weight: 3
  showOnNavbar: true

categories:
  - name: Platform & Cloud
    genericIcon: cloud
    skills:
      - name: Google Cloud Platform
        icon: "gcp.svg"
        summary: "Deployed and operated multi-cluster GKE platforms in production."
        url: "https://cloud.google.com/docs"
      - name: AWS
        icon: "aws.svg"
        summary: "Worked with AWS-hosted infrastructure for application deployment."
        url: "https://docs.aws.amazon.com/index.html"
      - name: Alibaba Cloud
        icon: "alibabacloud.svg"
        summary: "Deployed and managed production clusters on Alibaba Cloud."
        url: "https://www.alibabacloud.com/help"
      - name: DigitalOcean
        icon: "digitalocean.svg"
        summary: "Deployed and managed applications on DigitalOcean cloud servers."
        url: "https://docs.digitalocean.com/"

  - name: Container & Orchestration
    genericIcon: containers
    skills:
      - name: Docker
        icon: "docker.svg"
        summary: "Write most of the programs as dockerized container. Experienced with multi-stage, multi-arch build process."
        url: "https://docs.docker.com/"
      - name: Kubernetes
        icon: "kubernetes.png"
        summary: "Capable of deploying, managing application on Kubernetes. Experienced in writing Kubernetes controllers for HPA."
        url: "https://kubernetes.io/docs/home/"

  - name: Data & Messaging
    genericIcon: data
    skills:
      - name: Kafka
        icon: "kafka.svg"
        summary: "Log streaming backbone feeding the centralized ELK logging pipeline."
        url: "https://kafka.apache.org/documentation/"
      - name: Redis
        icon: "redis.svg"
        summary: "In-memory data store for caching and session management."
        url: "https://redis.io/docs/latest/"
      - name: Redpanda
        icon: "redpanda.png"
        summary: "Kafka-compatible streaming platform without the ZooKeeper/JVM overhead."
        url: "https://docs.redpanda.com/"

  - name: CI/CD & Automation
    genericIcon: cicd
    skills:
      - name: Jenkins
        icon: "jenkins.png"
        summary: "Using as the main tools for CI/CD development. Capable of build pipeline for scalable, testable, and maintainable program."
        url: "https://www.jenkins.io/doc/"
      - name: ArgoCD
        icon: "argocd.svg"
        summary: "GitOps continuous delivery -- full Bitbucket to Jenkins to ArgoCD pipeline for controlled, auditable deployments."
        url: "https://argo-cd.readthedocs.io/"
      - name: Kustomize
        icon: "kustomize.png"
        summary: "Native, template-free manifest management for GitOps -- preferred over Helm for auditable, declarative overlays."
        url: "https://kubectl.docs.kubernetes.io/references/kustomize/"
      - name: Ansible
        icon: "ansible.png"
        summary: "Able to create a configuration to automate multiple servers with ansible-playbook."
        url: "https://docs.ansible.com/"

  - name: Security & Compliance
    genericIcon: security
    skills:
      - name: Horusec
        icon: "horusec.png"
        summary: "SAST -- static application security testing in CI/CD before deploy."
        url: "https://docs.horusec.io/"
      - name: Trivy
        icon: "trivy.svg"
        summary: "SCA -- image and dependency vulnerability scanning in CI/CD before deploy."
        url: "https://trivy.dev/"
      - name: SonarQube
        icon: "sonarqube.svg"
        summary: "Code quality gate consolidating SAST/SCA findings before merge."
        url: "https://docs.sonarsource.com/sonarqube/"
      - name: SIEM (Wazuh)
        icon: "wazuh.png"
        summary: "Security monitoring and log correlation for threat detection across production infrastructure."
        url: "https://documentation.wazuh.com/"
      - name: HashiCorp Vault
        icon: "vault.svg"
        summary: "App-side secret management client for credentials and key rotation."
        url: "https://developer.hashicorp.com/vault"
      - name: Kyverno
        icon: "kyverno.png"
        summary: "Kubernetes-native policy engine enforcing security and governance guardrails on cluster resources."
        url: "https://kyverno.io/docs/"
      - name: cert-manager
        icon: "certmanager.png"
        summary: "Automated TLS certificate issuance and renewal for in-cluster workloads."
        url: "https://cert-manager.io/docs/"
      - name: Cloudflare WAF
        icon: "cloudflare.svg"
        summary: "Edge web application firewall and DDoS protection in front of production traffic."
        url: "https://developers.cloudflare.com/waf/"
      - name: Snyk
        icon: "snyk.svg"
        summary: "Developer-first SCA/SAST scanning for dependency and code vulnerabilities."
        url: "https://docs.snyk.io/"

  - name: FinOps
    genericIcon: finops
    skills:
      - name: Kubecost
        icon: "kubecost.svg"
        summary: "Cost visibility for Kubernetes workloads via a Crawl-Walk-Run FinOps adoption framework."
        url: "https://www.kubecost.com/"

  - name: Observability & Monitoring
    genericIcon: observability
    skills:
      - name: Grafana
        icon: "grafana.png"
        summary: "Capable of setup and configure with Prometheus metrics. Also, experienced with writing metric exporters."
        url: "https://grafana.com/docs/"
      - name: Prometheus
        icon: "prometheus.svg"
        summary: "Metrics collection and alerting paired with Grafana dashboards across GKE clusters."
        url: "https://prometheus.io/docs/"
      - name: Datadog
        icon: "datadog.svg"
        summary: "APM and infrastructure monitoring for production incident visibility."
        url: "https://docs.datadoghq.com/"
      - name: ELK Stack
        icon: "elasticsearch.svg"
        summary: "Centralized logging pipeline (Elasticsearch, Logstash, Kibana) with Kafka for log streaming."
        url: "https://www.elastic.co/guide/"

  - name: Systems & Networking
    genericIcon: systems
    skills:
      - name: Linux Server
        icon: "ubuntu.png"
        summary: "Using the main server operating system such as Ubuntu, Centos, RHEL, Fedora, and many more. Capable of writing bash/shell scripts."
        url: "https://ubuntu.com/server/docs"
      - name: GitOps
        icon: "git.png"
        summary: "Git-based development and GitOps delivery workflows. Mostly GitHub, also experienced with GitLab and Bitbucket."
        url: "https://git-scm.com/doc"
      - name: OPNsense
        icon: "opnsense.svg"
        summary: "Built and maintained a custom OPNsense firewall image for secure network segmentation."
        url: "https://docs.opnsense.org/"
